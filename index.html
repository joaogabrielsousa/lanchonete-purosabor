<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <div class="container-header">
            <section class="header-logo">
                <!-- logo -->
                <img src="src/images/logo-ex.jfif" alt="logo da marca">
            </section>
            <section>
                <!-- abas -->
                <nav class="navbar-header">
                    <li class="container-li">
                        <ul>
                            Ínicio
                        </ul>
                        <ul>
                            Cardápio
                        </ul>
                        <ul>
                            Contato
                        </ul>
                        <ul>
                            Sobre
                        </ul>
                    </li>
                </nav>
            </section>
            <section class="header-cart">
                <!-- carrinho -->
                <i data-lucide="shopping-cart" class="btn-cart"></i>
            </section>
        </div>
    </header>
    <main>
        <div>
            <section class="section-hero">
                <!-- hero -->
                <button class="btn-ofertas">
                    Ofertas >
                </button>
            </section>
            <section class="section-catalago">
                <!-- cardapio -->
                 <div>
                    <div class="container-txt">
                        <h3 class="txt-cardapio">
                            faça seu pedido
                        </h3>
                    </div>
                    <!-- categorias -->
                    <div class="container-categoria">
                        <button class="btn-select">
                            Todos
                        </button>
                        <button class="">
                            Hambuguer
                        </button>
                        <button class="">
                            Batatas
                        </button>
                        <button class="">
                            Promos
                        </button>
                        <button class="">
                            Bebidas
                        </button>
                    </div>
                 </div>
                 <div>
                    <div class="container-menu">
                        <div class="catalago">
                            <picture>
                                <img src="src/images/cardapio/humbuguer-simples.jfif" alt="hamburguer simples"
                                class="img-catalago"
                                >
                            </picture>
                            <div class="info-catalago">
                                <h4>
                                    Hambúrguer
                                </h4>
                                <p>
                                    <!-- description -->
                                </p>
                            </div>
                        </div>
                        <div class="catalago">
                            <picture>
                                <img src="src/images/cardapio/hamburguer-x-bacon.jfif" alt="hamburguer x-bacon"
                                class="img-catalago"
                                >
                            </picture>
                            <div class="info-catalago">
                                <h4>
                                    Hambúrguer
                                </h4>
                                <p>
                                    <!-- description -->
                                </p>
                            </div>
                        </div>
                        <div class="catalago">
                            <picture>
                                <img src="src/images/cardapio/hamburguer-x-tudo.jfif" alt="hamburguer X-Tudo"
                                class="img-catalago"
                                >
                            </picture>
                            <div class="info-catalago">
                                <h4>
                                    Hambúrguer
                                </h4>
                                <p>
                                    <!-- description -->
                                </p>
                            </div>
                        </div>
                        <div class="catalago">
                            <picture>
                                <img src="src/images/cardapio/batata-frita-simples.jfif" alt="batata simples"
                                class="img-catalago"
                                >
                            </picture>
                            <div class="info-catalago">
                                <h4>
                                    Batata Frita
                                </h4>
                                <p>
                                    <!-- description -->
                                </p>
                            </div>
                        </div>
                        <div class="catalago">
                            <picture>
                                <img src="src/images/cardapio/batata-frita-calabresa.jfif" alt="batata com calabresa"
                                class="img-catalago"
                                >
                            </picture>
                            <div class="info-catalago">
                                <h4>
                                    Batata Frita
                                </h4>
                                <p>
                                    <!-- description -->
                                </p>
                            </div>
                        </div>
                        <div class="catalago">
                            <picture>
                                <img src="src/images/cardapio/batata-frita-completa.jfif" alt="batata completa"
                                class="img-catalago"
                                >
                            </picture>
                            <div class="info-catalago">
                                <h4>
                                    Batata Frita
                                </h4>
                                <p>
                                    <!-- description -->
                                </p>
                            </div>
                        </div>
                    </div>
                 </div>
            </section>
        </div>
    </main>
    <footer>
        <div>
            <section>
                <!-- infos basicas -->
            </section>
        </div>
    </footer>

    <!-- Script dos Icones -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
